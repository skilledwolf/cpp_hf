[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.11",
    "numpy",
    "setuptools_scm[toml]>=8",
    # jaxlib ships the XLA FFI headers the C++ kernels compile against.
    "jax>=0.5.3",
]
build-backend = "scikit_build_core.build"

[project]
name = "hartreefock-ffi"
dynamic = ["version", "dependencies"]
description = "OpenMP C++ kernels (FFTW + Eigen) for contimod's Hartree-Fock engine, called through jax.ffi"
readme = "Readme.md"
requires-python = ">=3.10"
authors = [{ name = "Tobias Wolf", email = "public@wolft.xyz" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hartree-fock", "fftw", "eigen", "pybind11", "condensed-matter", "physics"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[project.urls]
Homepage = "https://github.com/skilledwolf/cpp_hf"
Issues   = "https://github.com/skilledwolf/cpp_hf/issues"

[tool.scikit-build]
wheel.packages = ["src/hartreefock_ffi"]
# The in-tree provider below needs scikit-build-core's plugin support.
experimental = true

# The kernels are registered only under the jaxlib they were built against,
# so the wheel's dependencies pin that jaxlib (ci/jaxlib_pin.py).
[tool.scikit-build.metadata.dependencies]
provider = "jaxlib_pin"
provider-path = "ci"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0"

[tool.scikit-build.cmake.define]
HF_USE_OPENMP = true
HF_USE_FFTW_THREADS = true
CMAKE_OSX_DEPLOYMENT_TARGET = { env = "MACOSX_DEPLOYMENT_TARGET", default = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

# ---------------------------------------------------------------------------
# cibuildwheel: manylinux ships no FFTW, so before-all builds it from source
# into .cache/fftw-3.3.10-<arch>, the environment block points CMake's
# pkg-config finder at it, and repair bundles the shared lib into the wheel.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_*"
# Load the extension from the repaired, installed wheel and check its kernels.
test-command = "python {project}/ci/smoke_test.py"

[tool.cibuildwheel.linux]
before-all = "bash ci/linux_before_all.sh"
manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = """
LD_LIBRARY_PATH=/project/.cache/fftw-3.3.10-$(uname -m)/lib:$LD_LIBRARY_PATH \
  auditwheel repair -w {dest_dir} {wheel}
"""

[tool.cibuildwheel.macos]
archs = ["native"]
# One script handles both archs: arm64 builds FFTW from source, x86_64 uses brew.
before-all = "bash ci/macos_arm_fftw.sh"
repair-wheel-command = """
delocate-wheel -L hartreefock_ffi/.dylibs --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
"""

# Teach CMake/pkg-config where the cached FFTW lives.
[tool.cibuildwheel.linux.environment]
PKG_CONFIG_PATH   = "/project/.cache/fftw-3.3.10-x86_64/lib/pkgconfig:/project/.cache/fftw-3.3.10-aarch64/lib/pkgconfig:$PKG_CONFIG_PATH"
CMAKE_PREFIX_PATH = "/project/.cache/fftw-3.3.10-x86_64:/project/.cache/fftw-3.3.10-aarch64:$CMAKE_PREFIX_PATH"
LIBRARY_PATH      = "/project/.cache/fftw-3.3.10-x86_64/lib:/project/.cache/fftw-3.3.10-aarch64/lib:$LIBRARY_PATH"
CPATH             = "/project/.cache/fftw-3.3.10-x86_64/include:/project/.cache/fftw-3.3.10-aarch64/include:$CPATH"
